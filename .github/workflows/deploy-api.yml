# .github/workflows/deploy-api.yml
# develop  -> déploie en TEST automatiquement
# tag v*   -> déploie en PROD (approbation via l'environnement GitHub "production")
# manuel   -> onglet Actions > Deploy API > Run workflow (choix test/prod)
name: Deploy API

on:
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Environnement cible
        type: choice
        options: [test, prod]
        default: test

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || (startsWith(github.ref, 'refs/tags/') && 'prod' || 'test') }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # Garde-fou : sans migrations compilées, le déploiement tournerait
      # sur un schéma potentiellement en retard sans rien signaler.
      - name: Vérifier les migrations compilées
        run: ls dist/database/migrations/*.js

      - uses: actions/upload-artifact@v4
        with:
          name: api-release
          path: |
            dist/
            public/assets/
            package.json
            package-lock.json
            .npmrc
            ecosystem.config.js
            scripts/remote-deploy.sh
          include-hidden-files: true   # .npmrc
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'prod' || startsWith(github.ref, 'refs/tags/')) && 'production' || 'test' }}
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (startsWith(github.ref, 'refs/tags/') && 'prod' || 'test') }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-release
          path: release

      - name: Configurer SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Nom de release
        run: echo "REL=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Upload
        run: |
          rsync -az --mkpath release/ \
            "$SSH_USER@$SSH_HOST:api-$TARGET/releases/$REL/"

      - name: Activer la release
        run: |
          ssh "$SSH_USER@$SSH_HOST" \
            "bash api-$TARGET/releases/$REL/scripts/remote-deploy.sh $TARGET $REL"
